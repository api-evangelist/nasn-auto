name: nasn-auto
description: 'NASN Automotive Electronics Co., Ltd. is a Shanghai-based automotive chassis
  electronic-control manufacturer founded in 2016, developing brake-by-wire and steer-by-wire
  systems for smart and assisted driving. Its products include the NBooster intelligent
  braking system, brushless electric power steering (EPS) controllers, and motion-control
  solutions for autonomous vehicles. Backed by Qiming Venture Partners, Matrix Partners China,
  Hillhouse and CATL, NASN has raised roughly $231M and is a Tier-1 supplier pursuing a Hong Kong
  listing. Surfaced as a Qiming portfolio company; NASN is an automotive hardware manufacturer with
  no public developer API surface at nasn-auto.com.'
